name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"
  PYTHON_VERSION: "3.11"

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go tests
        run: go test ./... -v -race -count=1

      - name: Run Go vet
        run: go vet ./...

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Install opencloud-adapter (editable)
        run: pip install -e python/

      - name: Run Python unit tests
        run: pytest tests/ -v --ignore=tests/test_integration.py

  build-lib:
    name: Build Shared Library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Build shared library
        run: |
          mkdir -p build
          CGO_ENABLED=1 go build -buildmode=c-shared -o build/libcloudadapter.so ./cmd/

      - name: Verify library
        run: |
          file build/libcloudadapter.so
          nm -D build/libcloudadapter.so | grep CloudAdapter_ | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcloudadapter-linux-amd64
          path: go/build/libcloudadapter.so
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-test, build-lib]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e python/

      - name: Build shared library
        run: |
          cd go
          go mod download
          mkdir -p build
          CGO_ENABLED=1 go build -buildmode=c-shared -o build/libcloudadapter.so ./cmd/

      - name: Start local services
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" opencloud-minio 2>/dev/null | grep -q healthy; do sleep 2; done'
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" opencloud-nats 2>/dev/null | grep -q healthy; do sleep 2; done'
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" opencloud-redis 2>/dev/null | grep -q healthy; do sleep 2; done'
          timeout 90 bash -c 'until docker inspect --format="{{.State.Health.Status}}" opencloud-scylladb 2>/dev/null | grep -q healthy; do sleep 2; done'
          echo "All services healthy"
          docker compose -f docker/docker-compose.yml ps

      - name: Run integration tests
        env:
          CLOUD_ADAPTER_SO_PATH: ${{ github.workspace }}/go/build/libcloudadapter.so
          OPENCLOUD_STORAGE_URL: "s3://test-bucket?endpoint=http://localhost:19000&s3ForcePathStyle=true&disableSSL=true&region=us-east-1"
          OPENCLOUD_PUBSUB_TOPIC_URL: "nats://events"
          OPENCLOUD_DATABASE_URL: "dynamodb://test-table?endpoint=http://localhost:18000&region=us-east-1"
          OPENCLOUD_SECRETS_URL: "redis://localhost:16379"
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        run: pytest tests/test_integration.py -v

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.yml down --timeout 10

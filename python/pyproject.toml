[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencloud-adapter"
version = "0.1.0"
description = "Multicloud adapter for RISEGen projects — Go CDK bridge with zero vendor lock-in"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["opencloud*", "opencloud_config*"]
